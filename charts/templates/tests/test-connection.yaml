apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fastapiapp.fullname" . }}-test-connection"
  labels:
    {{- include "fastapiapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: 
      - |
          wget -q -O- nginx:{{ .Values.nginx.service.port }}/api/v1/movies/docs && \
          wget -q -O- nginx:{{ .Values.nginx.service.port }}/api/v1/casts/docs
  restartPolicy: Never
