apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
  labels:
    app: movie-service
    {{- include "fastapiapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.movieService.replicaCount }}
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: movie-service
          image: "{{ .Values.movieService.image.repository }}:{{ .Values.movieService.image.tag }}"
          imagePullPolicy: {{ .Values.movieService.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URI
              value: {{ .Values.movieService.env.DATABASE_URI | quote }}
            - name: CAST_SERVICE_HOST_URL
              value: {{ .Values.movieService.env.CAST_SERVICE_HOST_URL | quote }}
          resources:
            {{- toYaml .Values.movieService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: movie-service
  labels:
    app: movie-service
    {{- include "fastapiapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.movieService.service.type }}
  selector:
    app: movie-service
  ports:
    - port: {{ .Values.movieService.service.port }}
      targetPort: {{ .Values.movieService.service.targetPort }}
      protocol: TCP
      name: http
