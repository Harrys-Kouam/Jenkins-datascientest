# Default values for fastapiapp chart.
# Deploys movie-service, cast-service, their PostgreSQL databases and an nginx gateway.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Movie service (FastAPI)
# ---------------------------------------------------------------------------
movieService:
  replicaCount: 1
  image:
    repository: harryskouam/movie_service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    DATABASE_URI: "postgresql://movie_db_username:movie_db_password@movie-db:5432/movie_db_dev"
    CAST_SERVICE_HOST_URL: "http://cast-service:8000/api/v1/casts/"
  resources: {}

# ---------------------------------------------------------------------------
# Cast service (FastAPI)
# ---------------------------------------------------------------------------
castService:
  replicaCount: 1
  image:
    repository: harryskouam/cast_service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    DATABASE_URI: "postgresql://cast_db_username:cast_db_password@cast-db:5432/cast_db_dev"
  resources: {}

# ---------------------------------------------------------------------------
# Movie database (PostgreSQL)
# ---------------------------------------------------------------------------
movieDb:
  image:
    repository: postgres
    tag: "12.1-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    username: movie_db_username
    password: movie_db_password
    database: movie_db_dev
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}

# ---------------------------------------------------------------------------
# Cast database (PostgreSQL)
# ---------------------------------------------------------------------------
castDb:
  image:
    repository: postgres
    tag: "12.1-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    username: cast_db_username
    password: cast_db_password
    database: cast_db_dev
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}

# ---------------------------------------------------------------------------
# Nginx gateway
# ---------------------------------------------------------------------------
nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  resources: {}
